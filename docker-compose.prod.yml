services:
  postgres:
    ports: !override []

  redis:
    ports: !override []

  mlflow:
    ports: !override []

  backend:
    ports: !override []
    environment:
      ALLOW_REGISTRATION: ${ATLAS_PRODUCTION_ALLOW_REGISTRATION:-false}
      DOCS_ENABLED: ${ATLAS_PRODUCTION_DOCS_ENABLED:-false}
      TRUSTED_PROXY_HEADERS: "true"
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}

  worker:
    environment:
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}

  frontend:
    ports: !override []

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: atlas-caddy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
